name: Build Xfce OS With Nix

on:
  # 1. 每天北京时间 03:33 (UTC 19:33) 定时执行
  schedule:
    - cron: '33 19 * * *'

  # 2. 仅当 main 分支有代码 push 时触发
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
    

  # 3. 支持在 GitHub 网页上手动点击运行
  workflow_dispatch:

permissions:
  contents: write # 允许创建 GitHub Release 并上传 ISO 文件
  packages: write # 允许向 GitHub Container Registry (GHCR) 推送镜像

env:
  NIX_CHANNEL: nixos-26.05

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 安装 Nix 工具链并显式绑定 nixpkgs 路径
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:${{ env.NIX_CHANNEL }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      # 2. 构建多层系统镜像 tar 包
      - name: Build Layered Docker Image
        run: |
          nix-build image.nix -o result

      # 3. 登录 GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. 加载并推送到 GHCR
      - name: Push to GHCR
        run: |
          docker load < result

          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/${REPO_OWNER}/my-x11-nixos-vm:latest"

          docker tag my-x11-nixos-vm:latest "$GHCR_IMAGE"
          echo ">>> 正在推送到 GHCR: $GHCR_IMAGE"
          docker push "$GHCR_IMAGE"

      # --- 以下为追加到 steps 末尾的代码 ---

      # 6. 生成发布所用的 Tag 与时间戳
      - name: Generate Release Tag
        id: vars
        run: |
          TAG_NAME="liveiso-$(date +'%Y%m%d%H%M')"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      # 7. 构建 NixOS LiveCD ISO
      - name: Build NixOS LiveCD ISO
        run: |
          # 若你有自定义的 iso.nix 配置，可替换为: nix-build '<nixpkgs/nixos>' -A config.system.build.isoImage -I nixos-config=./iso.nix -o iso-result
          # 默认使用 nixos 的 installation-cd-graphical 构建 ISO:
          nix-build '<nixpkgs/nixos>' -A config.system.build.isoImage -I nixos-config='<nixpkgs/nixos/modules/installer/cd-dvd/installation-cd-graphical-plasma5.nix>' -o iso-result
          
          # 将生成的 ISO 软链接复制为规范命名的文件
          cp iso-result/iso/*.iso my-x11-nixos-vm.iso

      # 8. 将大于 2GB 的 ISO 切割为多个 1.5GB 的文件
      - name: Split ISO
        run: |
          split -b 1500M my-x11-nixos-vm.iso my-x11-nixos-vm.iso.part-

      # 9. 发布切割后的 ISO 分卷到 GitHub Releases
      - name: Publish ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        with:
          files: my-x11-nixos-vm.iso.part-*
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "LiveISO Build ${{ steps.vars.outputs.tag }}"
          generate_release_notes: true
      
      # 5. 安装 Skopeo 并同步到阿里云 ACR
      - name: Sync Image from GHCR to Aliyun ACR using Skopeo
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo

          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SRC_IMAGE="docker://ghcr.io/${REPO_OWNER}/my-x11-nixos-vm:latest"
          DEST_IMAGE="docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/edwardwoodhub/my-x11-nixos-vm:latest"
          

          echo ">>> 正在使用 Skopeo 同步镜像到阿里云 ACR..."
          skopeo copy \
            --src-creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds="${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
            "$SRC_IMAGE" "$DEST_IMAGE"

          echo ">>> 同步完成！"
